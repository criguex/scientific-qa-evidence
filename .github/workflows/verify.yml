name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
        exclude:
          - os: ubuntu-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Checksums
        run: shasum -a 256 -c evidence/SHA256SUMS.txt
      - name: Saved numerical evidence
        run: python3 evidence/verify_numerical.py
      - name: Numerical runner (reruns all 84 variants)
        working-directory: evidence/numerical/source
        run: python3 -m unittest -v test_runner
      - name: Documentation consistency
        run: python3 evidence/test_consistency.py -v
      - name: Animation package
        run: python3 -m unittest discover -s animations -p 'test_*.py' -v
      - name: Comparator log sanitizer
        working-directory: evidence/formal/comparator
        run: python3 -m unittest -v test_sanitize_comparator_logs
      - name: Statement comparison
        working-directory: evidence/formal/statement-provenance
        run: python3 -m unittest -v test_compare_statements
      - name: Blind-fault protocol library
        working-directory: experiments/blind-faults
        run: python3 -m unittest -v test_protocol
      - name: Blind-fault evaluator v2 (absent and incomplete evidence)
        working-directory: experiments/blind-faults/v2
        run: python3 -m unittest -v test_protocol_v2 fuzz_v2
      - name: Mathlib controls (check receipts, recompute classes)
        working-directory: experiments/mathlib-controls
        run: python3 verify.py && python3 -m unittest -v test_verify
      - name: Receipt check on authentic records (recompute P6)
        working-directory: experiments/receipt-check
        run: python3 -m unittest -v test_results

  verificar:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
        exclude:
          - os: ubuntu-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: One-command check (verificar.py)
        run: python verificar.py
      - name: Page knows this fingerprint
        if: runner.os == 'Linux'
        run: |
          python3 - <<'EOF'
          import re, sys
          txt = open("mi_resultado.txt", encoding="utf-8").read()
          version = re.search(r"versión de los datos: ([0-9a-f]{12})", txt).group(1)
          code = re.search(r"huella: ([0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4})", txt).group(1)
          if f'"{version}": "{code}"' not in open("site/index.html", encoding="utf-8").read():
              sys.exit(f"site/index.html no conoce la huella {code} de la versión {version}: agrégala a REFS")
          print(f"La página conoce la huella {code} de la versión {version}")
          EOF
